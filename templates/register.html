{% extends "base.html" %}

{% block title %}Регистрация — AI Archive{% endblock %}

{% block content %}
<div class="auth-page">
    <section class="auth-container" aria-labelledby="register-title">
        <div class="auth-brand">
            <span class="auth-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h10a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 17 21H7a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M8 7h8M8 11h8M8 15h4"/></svg></span>
            AI Archive
        </div>
        <h1 id="register-title">Создайте аккаунт</h1>
        <p class="subtitle">Сохраняйте результаты обработки и формируйте собственный архив исследований.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username" class="required">Имя пользователя</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Придумайте имя пользователя">
            </div>
            <div class="form-group">
                <label for="password" class="required">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Придумайте пароль">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Создать аккаунт</button>
        </form>
        <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </section>
</div>
{% endblock %}
